http_listen_addr: "127.0.0.1:6060"
introspection_addr: "127.0.0.1:6061"
log_level: info

indexer:
  connstring: "postgres://clair:clair@127.0.0.1:5433/clair?sslmode=disable"
  migrations: true
  layer_scan_concurrency: 5
  scanner: {}

matcher:
  connstring: "postgres://clair:clair@127.0.0.1:5433/clair?sslmode=disable"
  indexer_addr: "http://127.0.0.1:6060"
  migrations: true
  period: "6h"
  disable_updaters: false

notifier:
  connstring: "postgres://clair:clair@127.0.0.1:5433/clair?sslmode=disable"
  indexer_addr: "http://127.0.0.1:6060"
  matcher_addr: "http://127.0.0.1:6060"
  migrations: true
  poll_interval: "5m"
  delivery_interval: "1m"

auth:
  psk: null
