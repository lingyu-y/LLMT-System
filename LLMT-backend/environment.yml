name: llmt-backend
channels:
  - conda-forge
  - defaults

dependencies:
  # Python版本（必须锁）
  - python=3.10

  # pip（必须有）
  - pip

  # pip安装的依赖
  - pip:
      # ========================
      # Web 框架
      # ========================
      - fastapi==0.110.0
      - uvicorn[standard]==0.29.0

      # ========================
      # 数据库
      # ========================
      - sqlalchemy==2.0.29
      - psycopg2-binary==2.9.9
      - alembic==1.13.1

      # ========================
      # 配置
      # ========================
      - pydantic==2.6.4
      - pydantic-settings==2.2.1
      - python-dotenv==1.0.1

      # ========================
      # 安全
      # ========================
      - python-jose[cryptography]==3.3.0
      - passlib[bcrypt]==1.7.4

      # ========================
      # 文件上传
      # ========================
      - python-multipart==0.0.9

      # ========================
      # HTTP
      # ========================
      - httpx==0.27.0

      # ========================
      # 日志
      # ========================
      - loguru==0.7.2

      # ========================
      # MinIO
      # ========================
      - minio==7.2.5

      # ========================
      # Redis
      # ========================
      - redis==5.0.3

      # ========================
      # InfluxDB
      # ========================
      - influxdb-client==1.43.0

      # ========================
      # Elasticsearch
      # ========================
      - elasticsearch==8.13.0

      # ========================
      # Celery
      # ========================
      - celery==5.3.6

      # ========================
      # 工具
      # ========================
      - tenacity==8.2.3
      - orjson==3.10.1

      # ========================
      # 训练框架
      # ========================
      - torch>=2.0.0
      - pyyaml>=6.0
      - click>=8.0
      - numpy>=1.24.0