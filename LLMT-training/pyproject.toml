[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llmt-training"
version = "0.1.0"
description = "Integrated PyTorch + DeepSpeed + Megatron-LM training framework"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "torch>=2.0.0",
    "pydantic>=2.0",
    "click>=8.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
deepspeed = ["deepspeed>=0.12.0"]
reporting = ["influxdb-client>=1.30.0", "minio>=7.0.0"]
all = ["deepspeed>=0.12.0", "influxdb-client>=1.30.0", "minio>=7.0.0"]

[project.scripts]
llmt-train = "llmt_training.cli.main:cli"

[tool.setuptools.package-dir]
llmt_training = "."

[tool.setuptools.packages.find]
include = ["config*", "core*", "data*", "models*", "trainers*", "launcher*", "reporting*", "cli*", "federated*"]
